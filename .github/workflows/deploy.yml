name: Deploy One Page (GitHub Pages)

# Met le site en ligne automatiquement à chaque modification de la page.
on:
  push:
    branches:
      - claude/padel-performance-landing-3homgn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
