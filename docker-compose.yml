# USAM Nîmes Gard — environnement local WordPress
#
# Lancement :
#   docker compose up -d
#   → WordPress sur http://localhost:8080
#   → Le thème USAM est monté en live, modifie les fichiers de wp-theme/ et rafraîchis.
#
# Reset complet (efface DB) :
#   docker compose down -v

services:
  wordpress:
    image: wordpress:6.4-php8.2-apache
    container_name: usam_wp
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: usam
      WORDPRESS_DB_PASSWORD: usam_local_dev
      WORDPRESS_DB_NAME: usam
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme:/var/www/html/wp-content/themes/usam
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: usam_db
    environment:
      MYSQL_DATABASE: usam
      MYSQL_USER: usam
      MYSQL_PASSWORD: usam_local_dev
      MYSQL_ROOT_PASSWORD: root_local_dev
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # Phpmyadmin : optionnel, pour inspecter la DB
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: usam_pma
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: usam
      PMA_PASSWORD: usam_local_dev
    restart: unless-stopped

volumes:
  wp_data:
  db_data:
