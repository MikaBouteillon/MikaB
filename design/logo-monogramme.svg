<?xml version="1.0" encoding="UTF-8"?>
<!--
  USAM Nîmes Gard — Monogramme (premier jet)
  Concept: 4 lettres USAM empilées en grille 2x2, traitement géométrique, accent Volt Green sur le M.
  À itérer avec un graphiste pour la version finale.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="USAM Nîmes Gard">
  <title>USAM Nîmes Gard</title>

  <!-- Fond blason -->
  <rect x="20" y="20" width="360" height="360" rx="32" fill="#0A0A0A"/>
  <rect x="20" y="20" width="360" height="360" rx="32" fill="none" stroke="#00E676" stroke-width="4"/>

  <!-- Grille 2x2 -->
  <g font-family="Anton, Impact, sans-serif" font-weight="400" text-anchor="middle">

    <!-- U haut-gauche -->
    <text x="120" y="180" font-size="140" fill="#F5F5F0">U</text>

    <!-- S haut-droite -->
    <text x="280" y="180" font-size="140" fill="#F5F5F0">S</text>

    <!-- A bas-gauche -->
    <text x="120" y="320" font-size="140" fill="#F5F5F0">A</text>

    <!-- M bas-droite (accent vert) -->
    <text x="280" y="320" font-size="140" fill="#00E676">M</text>
  </g>

  <!-- Séparateur central -->
  <line x1="200" y1="60" x2="200" y2="340" stroke="#0B3D2E" stroke-width="2"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#0B3D2E" stroke-width="2"/>

  <!-- Sous-titre -->
  <text x="200" y="372" font-family="Sora, sans-serif" font-weight="800" font-size="14"
        fill="#00E676" text-anchor="middle" letter-spacing="6">NÎMES · GARD</text>
</svg>
